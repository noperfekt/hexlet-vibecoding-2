<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор калорий</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Калькулятор калорий</h1>
    <p class="hint">Формула Миффлина — Сан-Жеора</p>

    <form id="form" novalidate>
      <fieldset>
        <legend>Пол</legend>
        <label><input type="radio" name="sex" value="male" checked> Мужской</label>
        <label><input type="radio" name="sex" value="female"> Женский</label>
      </fieldset>

      <label>Возраст (лет)
        <input type="number" id="age" min="10" max="100" value="30" required>
      </label>
      <label>Рост (см)
        <input type="number" id="height" min="100" max="250" value="175" required>
      </label>
      <label>Вес (кг)
        <input type="number" id="weight" min="30" max="300" step="0.1" value="70" required>
      </label>

      <label>Уровень активности
        <select id="activity">
          <option value="1.2">Минимальная (сидячая работа)</option>
          <option value="1.375">Низкая (1–3 тренировки в неделю)</option>
          <option value="1.55" selected>Средняя (3–5 тренировок)</option>
          <option value="1.725">Высокая (6–7 тренировок)</option>
          <option value="1.9">Очень высокая (физический труд + спорт)</option>
        </select>
      </label>

      <button type="submit">Рассчитать</button>
      <p id="error" class="error" role="alert"></p>
    </form>

    <section id="result" hidden>
      <div class="row"><span>Базовый обмен (BMR)</span><b id="bmr"></b></div>
      <div class="row"><span>Поддержание веса</span><b id="maintain"></b></div>
      <div class="row lose"><span>Похудение (−15%)</span><b id="lose"></b></div>
      <div class="row gain"><span>Набор массы (+15%)</span><b id="gain"></b></div>
    </section>
  </main>
  <script src="calculator.js"></script>
</body>
</html>
